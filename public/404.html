<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#050609" />
    <title>Page Not Found | Code Craft Labs</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
        background: #050609;
        color: #f5f7fa;
      }
      * { box-sizing: border-box; }
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background: radial-gradient(ellipse at 78% 42%, rgb(8 120 249 / 15%), transparent 34rem), #050609;
      }
      main { width: min(100% - 2.5rem, 56rem); padding-block: 5rem; }
      p { max-width: 40rem; color: #a1aab7; line-height: 1.7; }
      .eyebrow { color: #c8cdd5; font-size: .75rem; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; }
      h1 { max-width: 12ch; margin: 1.5rem 0; font-size: clamp(3rem, 9vw, 6rem); line-height: 1; letter-spacing: -.06em; }
      nav { display: flex; flex-wrap: wrap; gap: .75rem; margin-top: 2rem; }
      a { display: inline-flex; min-height: 2.9rem; align-items: center; border: 1px solid #28313d; border-radius: 999px; padding: .7rem 1.25rem; color: #f5f7fa; text-decoration: none; }
      a:first-child { border-color: #0878f9; background: #0878f9; }
      a:focus-visible { outline: 2px solid #12c8f5; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">404 — page not found</p>
      <h1>This page is off the map.</h1>
      <p>The page may have moved, or the address might be incorrect.</p>
      <nav aria-label="Helpful links">
        <a href="/">Return home</a>
        <a href="/work">Explore our work</a>
      </nav>
    </main>
  </body>
</html>
